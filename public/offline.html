<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#3366ff" />
<title>You are offline - University Manager</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#f8fafc; color:#0f172a; }
  .card { width:100%; max-width:420px; text-align:center; background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:36px 28px; box-shadow:0 1px 3px rgba(15,23,42,.06); }
  .logo { width:56px; height:56px; border-radius:16px; margin:0 auto 18px; background:linear-gradient(135deg,#4d7cff,#1d3fb8); display:flex; align-items:center; justify-content:center; font-size:28px; }
  h1 { margin:0 0 8px; font-size:22px; }
  p { margin:0 0 22px; font-size:14px; line-height:1.6; color:#64748b; }
  a, button { display:block; width:100%; margin-top:10px; padding:12px 16px; border-radius:12px; font-size:14px; font-weight:600; text-decoration:none; cursor:pointer; border:0; }
  .primary { background:#3366ff; color:#fff; }
  .secondary { background:#f1f5f9; color:#334155; }
  @media (prefers-color-scheme: dark) {
    body { background:#020617; color:#f1f5f9; }
    .card { background:#0f172a; border-color:#1e293b; }
    p { color:#94a3b8; }
    .secondary { background:#1e293b; color:#e2e8f0; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">&#127891;</div>
    <h1>You are offline</h1>
    <p>This page is not saved on your device yet. Pages you have already opened still work, and anything you add offline syncs automatically when you are back online.</p>
    <button class="primary" onclick="location.reload()">Try again</button>
    <a class="secondary" href="/dashboard">Open dashboard</a>
  </main>
</body>
</html>
